services:
  restapi:
    build:
      context: .
      dockerfile: restapi/Dockerfile
    container_name: restapi
    ports:
      - "8000:8000"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: backend
    ports:
      - "3001:3001"
    env_file:
      - ./.env
    depends_on:
      - restapi

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:3001}
        NEXT_PUBLIC_MAPS_API: ${NEXT_PUBLIC_MAPS_API}
    container_name: frontend
    environment:
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:3001}
      NEXT_PUBLIC_MAPS_API: ${NEXT_PUBLIC_MAPS_API}
    env_file:
      - ./.env
    ports:
      - "3000:3000"
    depends_on:
      - backend

  cron:
    build:
      context: .
      dockerfile: python_script/Dockerfile
    container_name: cron-bridge
    env_file:
      - ./.env
    environment:
      PREDICT_URL: http://restapi:8000/api/v1/predict
      UPDATE_URL: http://backend:3001/api/updateRiskLevel
    depends_on:
      - restapi
      - backend
    restart: unless-stopped

  drowning-detection:
    build:
      context: .
      dockerfile: drowning_v2/Dockerfile
    container_name: drowning-detection
    environment:
      BACKEND_URL: http://backend:3001
    depends_on:
      - backend
    restart: unless-stopped
    volumes:
      - ./drowning_v2/videos:/app/videos:ro

networks:
  default:
    name: beach-safety-net
