<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beach Safety Checker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .result {
            margin-top: 30px;
            padding: 20px;
            border-radius: 12px;
            display: none;
        }

        .result.show {
            display: block;
        }

        .safety-safe {
            background: #d4edda;
            border: 2px solid #28a745;
            color: #155724;
        }

        .safety-caution {
            background: #fff3cd;
            border: 2px solid #ffc107;
            color: #856404;
        }

        .safety-danger {
            background: #f8d7da;
            border: 2px solid #dc3545;
            color: #721c24;
        }

        .safety-level {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
        }

        .risk-factors {
            margin-top: 15px;
        }

        .risk-factors h3 {
            font-size: 16px;
            margin-bottom: 10px;
        }

        .risk-factors ul {
            list-style: none;
            padding-left: 0;
        }

        .risk-factors li {
            padding: 8px;
            margin-bottom: 5px;
            background: rgba(0, 0, 0, 0.05);
            border-radius: 5px;
        }

        .data-info {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(0, 0, 0, 0.1);
            font-size: 14px;
        }

        .data-info div {
            margin-bottom: 5px;
        }

        .loading {
            text-align: center;
            color: #667eea;
            margin-top: 20px;
            display: none;
        }

        .loading.show {
            display: block;
        }

        .error {
            background: #f8d7da;
            border: 2px solid #dc3545;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }

        .error.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1> Beach Safety Checker</h1>
        
        <div class="input-group">
            <label for="latitude">Latitude</label>
            <input type="number" id="latitude" step="any" placeholder="e.g., 13.00971" value="13.00971">
        </div>
        
        <div class="input-group">
            <label for="longitude">Longitude</label>
            <input type="number" id="longitude" step="any" placeholder="e.g., 74.78874" value="74.78874">
        </div>
        
        <button id="checkBtn" onclick="checkSafety()">Check Beach Safety</button>
        
        <div class="loading" id="loading">Loading...</div>
        
        <div class="error" id="error"></div>
        
        <div class="result" id="result">
            <div class="safety-level" id="safetyLevel"></div>
            <div class="risk-factors" id="riskFactors"></div>
            <div class="data-info" id="dataInfo"></div>
        </div>
    </div>

    <script>
        async function checkSafety() {
            const latitude = document.getElementById('latitude').value;
            const longitude = document.getElementById('longitude').value;
            const resultDiv = document.getElementById('result');
            const errorDiv = document.getElementById('error');
            const loadingDiv = document.getElementById('loading');
            const checkBtn = document.getElementById('checkBtn');

            // Validation
            if (!latitude || !longitude) {
                errorDiv.textContent = 'Please enter both latitude and longitude';
                errorDiv.classList.add('show');
                resultDiv.classList.remove('show');
                return;
            }

            if (latitude < -90 || latitude > 90) {
                errorDiv.textContent = 'Latitude must be between -90 and 90';
                errorDiv.classList.add('show');
                resultDiv.classList.remove('show');
                return;
            }

            if (longitude < -180 || longitude > 180) {
                errorDiv.textContent = 'Longitude must be between -180 and 180';
                errorDiv.classList.add('show');
                resultDiv.classList.remove('show');
                return;
            }

            // Show loading, hide results
            loadingDiv.classList.add('show');
            errorDiv.classList.remove('show');
            resultDiv.classList.remove('show');
            checkBtn.disabled = true;

            try {
                const response = await fetch('http://localhost:8000/api/v1/predict', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        latitude: parseFloat(latitude),
                        longitude: parseFloat(longitude)
                    })
                });

                if (!response.ok) {
                    throw new Error(`Error: ${response.status} - ${response.statusText}`);
                }

                const data = await response.json();

                // Display results
                const safetyLevel = data.safety_level;
                const resultDivClass = `safety-${safetyLevel.toLowerCase()}`;
                resultDiv.className = `result show ${resultDivClass}`;

                document.getElementById('safetyLevel').textContent = `Safety Level: ${safetyLevel}`;

                // Risk factors
                const riskFactorsDiv = document.getElementById('riskFactors');
                if (data.risk_factors && data.risk_factors.length > 0) {
                    riskFactorsDiv.innerHTML = '<h3>Risk Factors:</h3><ul>' +
                        data.risk_factors.map(factor => `<li>${factor}</li>`).join('') +
                        '</ul>';
                } else {
                    riskFactorsDiv.innerHTML = '';
                }

                // Data info
                const dataInfoDiv = document.getElementById('dataInfo');
                let infoHtml = '<strong>Current Conditions:</strong><br>';
                if (data.wave_height !== null && data.wave_height !== undefined) {
                    infoHtml += `Wave Height: ${data.wave_height.toFixed(2)}m<br>`;
                }
                if (data.wave_period !== null && data.wave_period !== undefined) {
                    infoHtml += `Wave Period: ${data.wave_period.toFixed(2)}s<br>`;
                }
                if (data.ocean_current_velocity !== null && data.ocean_current_velocity !== undefined) {
                    infoHtml += `Ocean Current: ${data.ocean_current_velocity.toFixed(2)} km/h`;
                }
                dataInfoDiv.innerHTML = infoHtml;

            } catch (error) {
                errorDiv.textContent = `Error: ${error.message}. Make sure the API server is running on http://localhost:8000`;
                errorDiv.classList.add('show');
                resultDiv.classList.remove('show');
            } finally {
                loadingDiv.classList.remove('show');
                checkBtn.disabled = false;
            }
        }

        // Allow Enter key to submit
        document.getElementById('latitude').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') checkSafety();
        });
        document.getElementById('longitude').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') checkSafety();
        });
    </script>
</body>
</html>
